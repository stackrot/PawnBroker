name: test

on:
  # PR branches are tested by pull_request; push only covers merges.
  push:
    branches: [main]
  pull_request:

# The tests only read the checkout.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to commits so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "luajit-2.1"
      # On Windows the setup action's bin/luajit has no .exe, which PowerShell
      # hands to Windows to open instead of running, so nothing runs and the
      # step still passes. lua(.exe) is the same LuaJIT on every OS, and the
      # grep fails the job unless scenarios really ran.
      - name: Tests
        shell: bash
        run: |
          lua -v
          lua tests/run.lua | tee test.log
          grep -q '^ok ' test.log
