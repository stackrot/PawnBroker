<!doctype html>
<!--
Mockups of the PawnBroker window for the README, drawn from real planner
output on the test data (tests/). Not game art: the icons are placeholders.
Render each view with a headless browser, for example:
  chromium --headless --hide-scrollbars --force-device-scale-factor=2
    --window-size=824,520 --screenshot=docs/plan.png
    "file://$PWD/docs/mockups/window.html?view=plan"
Views: plan and net at 824x520, near at 1060x520.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PawnBroker mockup</title>
<style>
	:root {
		--gold: #ffd100;
		--white: #f4f4f4;
		--grey: #8c8c8c;
		--green: #40ff40;
		--uncommon: #1eff00;
		--border: #7a6440;
	}
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		background: radial-gradient(ellipse at 30% 20%, #2d3340, #0d0f14 70%);
		font-family: "DejaVu Sans Condensed", "Arial Narrow", sans-serif;
		color: var(--white);
	}
	.stage { position: relative; padding: 20px; }
	.window {
		position: relative;
		width: 784px;
		height: 480px;
		background: linear-gradient(#1d1d20, #141416);
		border: 2px solid var(--border);
		border-radius: 6px;
		box-shadow: 0 0 0 1px #000, 0 8px 24px #000c;
	}
	.titlebar {
		height: 24px;
		background: linear-gradient(#2b2620, #1a1712);
		border-bottom: 1px solid #3b3122;
		border-radius: 4px 4px 0 0;
		text-align: center;
		font: 600 13px/24px "DejaVu Serif", serif;
		color: var(--gold);
		letter-spacing: 0.5px;
	}
	.close {
		position: absolute;
		right: 6px;
		top: 3px;
		width: 18px;
		height: 18px;
		border-radius: 3px;
		background: linear-gradient(#8c1c13, #4a0d08);
		border: 1px solid #c9a13b;
		color: #ffd6a0;
		font: bold 12px/16px sans-serif;
		text-align: center;
	}
	.portrait {
		position: absolute;
		left: -10px;
		top: -10px;
		width: 60px;
		height: 60px;
		border-radius: 50%;
		background: radial-gradient(circle at 40% 35%, #ffe680, #d4a017 45%, #6b4a0a 100%);
		border: 3px solid var(--border);
		box-shadow: 0 0 0 2px #000;
	}
	.header {
		position: absolute;
		left: 64px;
		top: 34px;
		right: 14px;
		font-size: 13px;
		color: var(--white);
	}
	.controls {
		position: absolute;
		left: 18px;
		right: 18px;
		top: 56px;
		height: 26px;
		display: flex;
		align-items: center;
		gap: 10px;
		font-size: 11px;
		color: var(--gold);
	}
	.input {
		height: 20px;
		background: #050505;
		border: 1px solid #5a5a5a;
		border-radius: 3px;
	}
	.check {
		width: 20px;
		height: 20px;
		background: #050505;
		border: 1px solid #8a8a8a;
		border-radius: 3px;
		color: var(--gold);
		font: bold 16px/18px sans-serif;
		text-align: center;
		margin-left: 2px;
	}
	.button {
		height: 22px;
		padding: 0 12px;
		background: linear-gradient(#a3221a, #5c0f0a);
		border: 1px solid #c9a13b;
		border-radius: 4px;
		color: var(--gold);
		font-size: 11.5px;
		line-height: 20px;
		text-align: center;
	}
	.button.disabled { color: #7a7a7a; background: linear-gradient(#5a4a46, #2c2422); }
	.spacer { flex: 1; }
	.columns, .row {
		display: flex;
		align-items: center;
		gap: 6px;
	}
	.columns {
		position: absolute;
		left: 44px;
		top: 92px;
		font-size: 11px;
		color: var(--gold);
	}
	.inset {
		position: absolute;
		left: 14px;
		right: 14px;
		top: 108px;
		bottom: 96px;
		background: #09090a;
		border: 1px solid #333;
		border-radius: 3px;
		overflow: hidden;
	}
	.list { position: absolute; left: 6px; top: 4px; right: 24px; }
	.scrollbar {
		position: absolute;
		right: 4px;
		top: 6px;
		bottom: 6px;
		width: 12px;
		background: #1a1a1a;
		border-radius: 6px;
	}
	.thumb {
		position: absolute;
		left: 2px;
		width: 8px;
		background: #5e5e5e;
		border-radius: 4px;
	}
	.row { height: 22px; font-size: 11px; }
	.row.hover { background: linear-gradient(90deg, #ffd10030, #ffd10010); }
	.title { height: 22px; line-height: 22px; padding-left: 4px; font-size: 13px; }
	.icon {
		width: 18px;
		height: 18px;
		margin: 0 4px 0 2px;
		border: 1px solid #000;
		border-radius: 2px;
		flex: none;
	}
	.c { white-space: nowrap; overflow: hidden; flex: none; }
	.r { text-align: right; }
	.item { color: var(--uncommon); }
	.net.near { color: var(--green); }
	.notes {
		position: absolute;
		left: 18px;
		right: 18px;
		bottom: 34px;
		font-size: 11px;
		line-height: 15px;
		color: var(--grey);
	}
	.status {
		position: absolute;
		left: 18px;
		bottom: 12px;
		font-size: 11px;
		color: var(--white);
	}
	.coin {
		display: inline-block;
		width: 9px;
		height: 9px;
		margin: 0 2px 0 1px;
		border-radius: 50%;
		vertical-align: -1px;
	}
	.g { background: radial-gradient(circle at 35% 35%, #fff2a8, #d4a017); }
	.s { background: radial-gradient(circle at 35% 35%, #ffffff, #9a9a9a); }
	.k { background: radial-gradient(circle at 35% 35%, #f0b98a, #9a5a2a); }
	.tooltip {
		position: absolute;
		width: 270px;
		padding: 8px 10px;
		background: #0b0c18f2;
		border: 2px solid #9a9a9a;
		border-radius: 5px;
		font-size: 12px;
		line-height: 16px;
	}
	.tooltip .name { font-size: 13.5px; color: var(--uncommon); }
	.tooltip .hint { color: #999; }
	/* Mod sites want a visible disclaimer on images that aren't the real
	   thing, so every view carries this badge. */
	.badge {
		position: absolute;
		right: 26px;
		bottom: 3px;
		padding: 1px 8px;
		border-radius: 8px;
		background: #000a;
		border: 1px solid #ffffff40;
		font-size: 11px;
		color: #ddd;
	}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
// Real planner output on the test data (level 18 mage, 1g 2s 84c carried,
// default near limit 5s). Net in the net view: Gnoll Casting Gloves set to
// sell for 20s, as in tests/scenarios/net.lua.
const plan = {
	header: "Mage: Fire, level 18, budget 1g 2s 84c, today's AH scan.",
	net: false,
	sections: [
		{ title: ["Buy 6 for ", 8700, " (net ", 6525, "), +21.3 Pawn"], color: "var(--gold)", rows: [
			["Hands", "Gnoll Casting Gloves", 2700, 2025, "+5.0 (+454%)", 17, 21],
			["Shoulder", "Double-Stitched Woolen Shoulders", 400, 300, "+4.5 (new)", 17, 379],
			["Chest", "Gray Woolen Robe", 1800, 1350, "+4.2 (+191%)", 16, 10],
			["Legs", "Colorful Kilt", 1700, 1275, "+3.8 (+230%)", 14, 73],
			["Back", "Heavy Woolen Cloak", 1400, 1050, "+3.3 (+298%)", 16, 48],
			["Wrist", "Bright Bracers", 700, 525, "+0.4 (+32%)", 18, 33],
		] },
		{ title: ["Better, but over budget"], color: "var(--grey)", rows: [
			["Back", "Crazed Firecaller's Cloak", 5500, 4125, "+4.1 (+373%)", 16, 1],
			["Wrist", "Mindthrust Bracers", 39900, 29925, "+3.7 (+266%)", 17, 2],
			["Weapon", "Defias Mage Staff", 5900, 4425, "+2.7 (+38%)", 11, 3],
			["Waist", "Keller's Girdle", 6700, 5025, "+2.1 (+113%)", 18, 34],
			["Finger", "Band of Purification", 5900, 4425, "+0.6 (new)", 18, 14],
		] },
		{ title: ["Near vendor price (net ", 500, " or less)"], color: "var(--green)", rows: [
			["Back", "Pearl-clasped Cloak", 500, 375, "+2.3 (+211%)", 14, 45],
			["Chest", "Green Woolen Vest", 400, 300, "+2.2 (+102%)", 12, 48],
			["Hands", "Heavy Woolen Gloves", 400, 300, "+1.9 (+170%)", 12, 79],
		] },
	],
	notes: [
		"54 random-suffix items for your level aren't priced yet. Scan suffixes with the AH open.",
		"Skipped 3 you can't use yet.",
		'Auctionator shopping list "PawnBroker" updated.',
	],
};

const netPlan = {
	header: "Mage: Fire, level 18, net budget 1g 2s 84c, today's AH scan.",
	net: true,
	sections: [
		{ title: ["Buy 7 for ", 9625, " net (", 14600, " up front), +23.9 Pawn"], color: "var(--gold)", rows: [
			["Hands", "Gnoll Casting Gloves", 2700, 700, "+5.0 (+454%)", 17, 21],
			["Shoulder", "Double-Stitched Woolen Shoulders", 400, 300, "+4.5 (new)", 17, 379],
			["Chest", "Gray Woolen Robe", 1800, 1350, "+4.2 (+191%)", 16, 10],
			["Legs", "Colorful Kilt", 1700, 1275, "+3.8 (+230%)", 14, 73],
			["Back", "Heavy Woolen Cloak", 1400, 1050, "+3.3 (+298%)", 16, 48],
			["Weapon", "Defias Mage Staff", 5900, 4425, "+2.7 (+38%)", 11, 3],
			["Wrist", "Bright Bracers", 700, 525, "+0.4 (+32%)", 18, 33],
		] },
		{ title: ["Better, but over budget"], color: "var(--grey)", rows: [
			["Back", "Crazed Firecaller's Cloak", 5500, 4125, "+4.1 (+373%)", 16, 1],
			["Wrist", "Mindthrust Bracers", 39900, 29925, "+3.7 (+266%)", 17, 2],
			["Waist", "Keller's Girdle", 6700, 5025, "+2.1 (+113%)", 18, 34],
			["Finger", "Band of Purification", 5900, 4425, "+0.6 (new)", 18, 14],
		] },
		{ title: ["Near vendor price (net ", 500, " or less)"], color: "var(--green)", rows: [
			["Back", "Pearl-clasped Cloak", 500, 375, "+2.3 (+211%)", 14, 45],
			["Chest", "Green Woolen Vest", 400, 300, "+2.2 (+102%)", 12, 48],
			["Hands", "Heavy Woolen Gloves", 400, 300, "+1.9 (+170%)", 12, 79],
		] },
	],
	notes: [
		"That plan needs 1g 46s up front; you carry 1g 2s 84c.",
		"54 random-suffix items for your level aren't priced yet. Scan suffixes with the AH open.",
		"Skipped 3 you can't use yet.",
		'Auctionator shopping list "PawnBroker" updated.',
	],
};

const NEAR = 500;
const ROW = 22;
const VISIBLE = 12;	// rows that fit the list area of the 480px window
const COLUMNS = [	// width, align
	["slot", 64, "l"], ["item", 236, "l"], ["price", 92, "r"],
	["net", 84, "r"], ["gain", 104, "r"], ["req", 34, "r"], ["listed", 46, "r"],
];
const HUES = { Hands: 28, Shoulder: 200, Chest: 0, Legs: 260, Back: 120,
	Wrist: 50, Weapon: 300, Waist: 170, Finger: 220 };

function coins(c) {
	const parts = [];
	const g = Math.floor(c / 10000), s = Math.floor(c / 100) % 100, k = c % 100;
	if (g) parts.push(`${g}<i class="coin g"></i>`);
	if (s) parts.push(`${s}<i class="coin s"></i>`);
	if (k || !parts.length) parts.push(`${k}<i class="coin k"></i>`);
	return parts.join(" ");
}

function cell(col, html, extra = "") {
	const [, width, align] = COLUMNS.find(c => c[0] === col);
	return `<div class="c ${align === "r" ? "r" : ""} ${extra}" style="width:${width}px">${html}</div>`;
}

function row(r, hover) {
	const [slot, name, price, net, gain, req, listed] = r;
	const hue = HUES[slot] ?? 40;
	const icon = `<div class="icon" style="background:linear-gradient(135deg,hsl(${hue} 45% 45%),hsl(${hue} 50% 18%))"></div>`;
	return `<div class="row ${hover ? "hover" : ""}">${icon}`
		+ cell("slot", slot)
		+ cell("item", `[${name}]`, "item")
		+ cell("price", coins(price))
		+ cell("net", net <= 0 ? "free" : coins(net), net <= NEAR ? "net near" : "net")
		+ cell("gain", gain) + cell("req", req) + cell("listed", listed)
		+ "</div>";
}

function title(t) {
	const text = t.title.map(p => typeof p === "number" ? coins(p) : p).join("");
	return `<div class="title" style="color:${t.color}">${text}</div>`;
}

// All list lines, then the ones in view from `first`.
function list(p, first, hoverName) {
	const lines = [];
	for (const s of p.sections) {
		lines.push(title(s));
		for (const r of s.rows) lines.push(row(r, r[1] === hoverName));
	}
	const shown = lines.slice(first, first + VISIBLE).join("");
	const track = 480 - 108 - 96 - 12;
	const thumb = Math.max(24, track * VISIBLE / lines.length);
	const top = (track - thumb) * first / Math.max(1, lines.length - VISIBLE);
	return { html: shown, thumb, top };
}

function window_(p, first, hoverName) {
	const l = list(p, first, hoverName);
	const cols = COLUMNS.map(([key, width, align]) => {
		const label = { slot: "Slot", item: "Item", price: "Price", net: "Net",
			gain: "Pawn gain", req: "Req", listed: "Listed" }[key];
		return `<div class="c ${align === "r" ? "r" : ""}" style="width:${width}px">${label}</div>`;
	}).join("");
	return `<div class="window">
		<div class="titlebar">PawnBroker</div><div class="close">✕</div>
		<div class="portrait"></div>
		<div class="header">${p.header}</div>
		<div class="controls">
			<span>Budget</span><div class="input" style="width:80px"></div>
			<span style="margin-left:4px">Levels above</span><div class="input" style="width:28px"></div>
			<div class="check">${p.net ? "✓" : ""}</div><span>Net cost</span>
			<div class="button" style="width:80px;margin-left:4px">Plan</div>
			<div class="spacer"></div>
			<div class="button" style="width:120px">Scan suffixes</div>
		</div>
		<div class="columns">${cols}</div>
		<div class="inset"><div class="list">${l.html}</div>
			<div class="scrollbar"><div class="thumb" style="top:${l.top}px;height:${l.thumb}px"></div></div>
		</div>
		<div class="notes">${p.notes.join("<br>")}</div>
		<div class="status">Plan ready.</div>
	</div>`;
}

// The Pearl-clasped Cloak's tooltip, from its stats in tests/mockdata.lua,
// plus the lines PawnBroker adds.
function tooltip(left, bottom) {
	return `<div class="tooltip" style="left:${left}px;bottom:${bottom}px">
		<div class="name">Pearl-clasped Cloak</div>
		<div>Binds when equipped</div>
		<div>Back</div>
		<div>16 Armor</div>
		<div>+3 Intellect</div>
		<div>+2 Spell Power</div>
		<div>Requires Level 14</div>
		<div>&nbsp;</div>
		<div>Vendors for ${coins(125)}, so it costs ${coins(375)} once you sell it on.</div>
		<div>&nbsp;</div>
		<div class="hint">Click to search the AH, shift-click to link.</div>
	</div>`;
}

const view = new URLSearchParams(location.search).get("view") || "plan";
const stage = document.getElementById("stage");
if (view === "net") {
	stage.innerHTML = window_(netPlan, 0);
} else if (view === "near") {
	// Scrolled to the end, hovering the first near-vendor item.
	const names = [];
	for (const s of plan.sections) {
		names.push(null);
		for (const r of s.rows) names.push(r[1]);
	}
	const first = names.length - VISIBLE;
	stage.innerHTML = window_(plan, first, "Pearl-clasped Cloak");
	// ANCHOR_RIGHT: the tooltip's bottom-left corner meets the row's
	// top-right. The row's top is stage padding, window border, list top,
	// then its place in view; its right edge is the list's.
	const at = names.indexOf("Pearl-clasped Cloak") - first;
	const rowTop = 20 + 2 + 108 + 4 + at * ROW;
	const rowRight = 20 + 2 + 14 + 6 + (784 - 2 * 14 - 30);
	stage.innerHTML += tooltip(rowRight, 520 - rowTop);
} else {
	stage.innerHTML = window_(plan, 0);
}
stage.innerHTML += '<div class="badge">Mockup, not a game screenshot</div>';
</script>
</body>
</html>
